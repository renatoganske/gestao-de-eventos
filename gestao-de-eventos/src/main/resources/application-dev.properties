spring.datasource.url=jdbc:postgresql://localhost:5432/gestaodeeventosdb
spring.datasource.username=postgres
spring.datasource.password=1234

#config para subir aplicação sem ter banco de dados configurado
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# ADR-0017: secret de dev, nunca usado em producao (application-prod.properties exige
# JWT_SECRET via variavel de ambiente, sem default). Precisa ter pelo menos 32 bytes
# para HS256.
app.security.jwt.secret=dev-only-secret-nao-use-em-producao-0123456789
app.security.jwt.expiration-ms=86400000

# Usuario unico semeado no primeiro boot (ver AdminUserSeeder) -- so cria se a
# tabela tb_app_user estiver vazia.
app.security.admin.username=admin
app.security.admin.password=admin
