info.app.name=@project.name@
info.app.description=@project.description@
info.app.version=@project.version@

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

spring.application.name=gestao-de-eventos

spring.datasource.url=jdbc:postgresql://localhost:5432/gestaodeeventosdb
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Lets Flyway adopt a pre-existing (pre-Flyway) local schema instead of refusing to start.
# Harmless on an empty schema; on a populated one Hibernate's validate step below still
# catches real drift from V1__baseline.sql, it just fails there instead of at Flyway.
spring.flyway.baseline-on-migrate=true

#config para subir aplicação sem ter banco de dados configurado
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration