info.app.name=@project.name@
info.app.description=@project.description@
info.app.version=@project.version@

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

spring.application.name=gestao-de-eventos
spring.profiles.active=dev

# ADR-0017: bloqueio em memoria por usuario apos tentativas de login falhas
# seguidas, sem dependencia externa -- mesmo valor para dev e prod, nao depende
# de segredo/ambiente. cleanup-interval-ms evita que o mapa cresca sem limite
# se alguem mandar um username diferente a cada tentativa (achado da auditoria
# de seguranca da PR #29).
app.security.login.max-attempts=5
app.security.login.lockout-minutes=15
app.security.login.cleanup-interval-ms=60000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# GDE-52: loga ao fim de cada requisicao quantas queries JDBC rodaram. Desligado por padrao;
# em producao liga/desliga pela env HIBERNATE_STATISTICS no painel do Render, sem deploy.
# O placeholder da a variavel um nome curto. Sem ele o override por env teria que ser
# SPRING_JPA_PROPERTIES_HIBERNATE_GENERATE_STATISTICS, em que o relaxed binding nao distingue
# o "_" de generate_statistics do separador entre niveis. Chaves escritas aqui, como
# default_batch_fetch_size abaixo, mantem o "_" e nao precisam de placeholder.
spring.jpa.properties.hibernate.generate_statistics=${HIBERNATE_STATISTICS:false}
# GDE-52 / ADR-0027: carrega colecoes lazy e to-ones em lotes (WHERE id IN (...)) em vez de
# uma query por entidade -- elimina o N+1 de Event.toDTO() e dos toResponseDto().
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# No spring.flyway.baseline-on-migrate here on purpose: it would let Flyway stamp any
# pre-existing schema as "already at V1" without ever running V1__baseline.sql for real.
# This project's local DB has no data to preserve (ADR-0008) -- if V1 ever fails to apply
# against this DB, that's a real signal something is wrong, not something to paper over.
# Hibernate's validate above only checks that entity-mapped columns exist with matching
# types; it does NOT catch extra/orphaned columns, nullability beyond what's mapped, or
# missing indexes/FKs -- it is not a substitute for the migration actually running.
