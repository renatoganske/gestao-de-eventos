# DATASOURCE_URL deve ser so a JDBC URL, sem usuario/senha embutidos -- o driver do
# Postgres nao aceita user:senha@host na authority da URL:
# jdbc:postgresql://<host>/<database>?sslmode=require&channel_binding=require
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}

# Porta injetada pelo Render em runtime; 8080 so entra em cena se PORT nao estiver setada.
server.port=${PORT:8080}

# ADR-0017: sem default de JWT_SECRET em prod -- se nao estiver setada, a app falha
# ao subir em vez de rodar com um secret previsivel.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ADMIN_USERNAME/ADMIN_PASSWORD sao usados apenas pelo AdminUserSeeder no primeiro
# boot (tb_app_user vazia). Depois do primeiro usuario criado, trocar a senha e via
# runbook manual (UPDATE em tb_app_user), nao reenviando ADMIN_PASSWORD.
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:}
