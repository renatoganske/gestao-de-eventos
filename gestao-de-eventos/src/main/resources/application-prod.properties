# DATASOURCE_URL deve ser so a JDBC URL, sem usuario/senha embutidos -- o driver do
# Postgres nao aceita user:senha@host na authority da URL:
# jdbc:postgresql://<host>/<database>?sslmode=require&channel_binding=require
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}

# Porta injetada pelo Render em runtime; 8080 so entra em cena se PORT nao estiver setada.
server.port=${PORT:8080}
