name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gestaodeeventosdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "1234"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: gestao-de-eventos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw --batch-mode clean test

  tag-release:
    needs: backend-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: gestao-de-eventos

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Read project version
        id: version
        run: |
          VERSION=$(./mvnw --batch-mode -q -N help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # GDE-34: versionamento "leve" -- a versao continua sendo bumped a mao no
      # pom.xml (SemVer); este job so espelha esse bump como tag git quando o
      # merge para main acontece, sem decidir nada por conta propria. Enquanto
      # a versao for -SNAPSHOT (nenhuma release cortada ainda), nao ha o que
      # taguear. Ver ADR-0018.
      - name: Tag release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "Versao $VERSION e SNAPSHOT, nenhuma tag sera criada."
            exit 0
          fi

          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG ja existe, nada a fazer."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
